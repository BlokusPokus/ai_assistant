global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/critical-alerts.yml"
  - "/etc/prometheus/rules/warning-alerts.yml"
  - "/etc/prometheus/rules/info-alerts.yml"

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Personal Assistant API (Prometheus exposition format)
  - job_name: "personal_assistant_api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  # Celery Worker (task execution metrics for Task dashboard)
  - job_name: "celery_worker"
    static_configs:
      - targets: ["worker:9091"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  # PostgreSQL (via postgres_exporter; add postgres_exporter service in compose to get data)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]
    metrics_path: "/metrics"

  # Redis: do NOT scrape redis:6379 directly (Redis uses RESP, not HTTP).
  # Scraping it causes "Possible SECURITY ATTACK" in Redis logs. Use redis_exporter when needed:
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis_exporter:9121"]
  #   # redis_exporter exposes HTTP /metrics; add redis_exporter service to compose to enable

  # Node Exporter (optional: run on host for host metrics; comment in when node_exporter is running)
  # - job_name: "node"
  #   static_configs:
  #     - targets: ["host.docker.internal:9100"]
