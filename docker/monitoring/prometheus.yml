global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Personal Assistant API (Prometheus exposition format)
  - job_name: "personal_assistant_api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  # PostgreSQL Database
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]
    # Note: Requires postgres_exporter for actual metrics

  # Redis: do NOT scrape redis:6379 directly (Redis uses RESP, not HTTP).
  # Scraping it causes "Possible SECURITY ATTACK" in Redis logs. Use redis_exporter when needed:
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis_exporter:9121"]
  #   # redis_exporter exposes HTTP /metrics; add redis_exporter service to compose to enable

  # Node Exporter (if running on host)
  - job_name: "node"
    static_configs:
      - targets: ["host.docker.internal:9100"]
    # Note: Requires node_exporter to be running on host
